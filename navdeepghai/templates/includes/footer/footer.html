<footer class="site-footer" role="contentinfo" data-section-id="footer" data-section-type="footer-section" style="border: 1px solid #dddddd;">
  <div class="page-width">
	  <div class="site-footer__content">
		  <div class="site-footer__item site-footer__item--one-half">
          	<div class="site-footer__item-inner site-footer__item-inner--link_list">
				<p class="h4">Quick links</p>
                <ul class="site-footer__linklist list--inline">
                    <li class="site-footer__linklist-item">
                        <a href="/terms-and-conditions">
                            Terms and Conditions
                        </a>
                    </li>
				</ul>
                <ul class="site-footer__linklist list--inline">
                    <li class="site-footer__linklist-item">
                        <a href="/privacy-policy">
                          Privacy Policy
                        </a>
                    </li>
				</ul>
			</div>
        </div>
		<div class="site-footer__item site-footer__item--one-half">
			<div class="site-footer__item-inner site-footer__item-inner--newsletter">
				<p class="h4">Newsletter</p>
				<div class="site-footer__newsletter">
					<form method="post" action="/contact#ContactFooter" id="ContactFooter" accept-charset="UTF-8" class="contact-form" novalidate="novalidate">
						<input type="hidden" name="form_type" value="customer">
						<input type="hidden" name="utf8" value="✓">
						<input type="hidden" name="contact[tags]" value="newsletter">
						<div class="input-group ">
							<input type="email" name="contact[email]" id="ContactFooter-email" class="input-group__field newsletter__input" value="" placeholder="Email address" aria-label="Email address" aria-required="true" required="" autocorrect="off" autocapitalize="off">
							<span class="input-group__btn">
								<button type="submit" class="btn btn-primary newsletter__submit" name="commit" id="Subscribe">
									<span class="newsletter__submit-text--large">Subscribe</span>
								</button>
							</span>
                    	</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
<hr class="site-footer__hr">
<div class="page-width">
	<div class="grid grid--no-gutters small--text-center grid--footer-float-right">
        <div class="grid__item small--hide one-half site-footer-item-center-vertically">
            <div class="grid__item site-footer__payment-icons">
                <span class="visually-hidden">Payment methods</span>
                <ul class="payment-icons list--inline site-footer__icon-list">
                </ul>
            </div>
        </div>
		<div class="grid__item one-half small--one-whole site-footer-item-tall">
			<ul class="list--inline site-footer__social-icons social-icons site-footer__icon-list">
                {%- if footer_settings -%}
                    {% for item in footer_settings.footer_items -%}
        				<li class="social-icons__item">
        					<a class="social-icons__link" target="{{item.target}}" href="{{item.url}}" aria-describedby="a11y-external-message">
        						<i class="fab {{item.icon}} fa-2x"></i>
        						<span class="icon__fallback-text">{{item.title }}</span>
                          </a>
                        </li>
                    {%- endfor -%}
                {%- endif -%}
			</ul>
		</div>
		<div class="grid__item medium-up--hide one-half small--one-whole">
			<div class="grid__item site-footer__payment-icons">
				<span class="visually-hidden">Payment methods</span>
				<ul class="payment-icons list--inline site-footer__icon-list">
				</ul>
    		</div>
		</div>
		<div class="grid__item small--one-whole  site-footer-item-align-right">
			<small class="site-footer__copyright-content site-footer__copyright-content--powered-by">
				<a target="_blank" rel="nofollow noopener" href="#" aria-describedby="a11y-new-window-external-message">
					{% if copyright %}
						&copy; {{ copyright }}
					{% endif %}
				</a>
			</small>
      	</div>
	</div>
  </div>
</footer>
